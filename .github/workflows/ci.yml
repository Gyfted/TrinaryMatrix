name: CI

on:
  push:
    branches: [main, codex/ternary-inference-scaffold]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Run tests and API documentation examples
        run: cargo test --locked --offline
      - name: Check synthetic inference demo
        run: cargo run --locked --offline -- --check
